<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<!-- iOS PWA Meta Tags -->
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="ImmichFrame" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
	<!-- Android/Desktop PWA -->
	<link rel="manifest" href="/manifest.webmanifest" />
	<meta name="theme-color" content="#000000" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" style="background-color: #000">
	<div
		id="splash"
		style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999; background-color: #000; display: flex; align-items: center; justify-content: center; transition: opacity 1s ease"
	>
		<img src="%sveltekit.assets%/logo-splash-animated.svg" alt="" style="height: 70vh; width: auto" />
	</div>
	<script>
		(function () {
			var splash = document.getElementById('splash');
			// Only the slideshow gets the splash, not the admin UI.
			if (location.pathname.indexOf('/admin') === 0) {
				splash.parentNode.removeChild(splash);
				return;
			}
			var MIN_VISIBLE_MS = 2000;
			var shownAt = Date.now();
			window.hideSplash = function () {
				if (!splash || splash.getAttribute('data-hiding')) return;
				splash.setAttribute('data-hiding', '1');
				setTimeout(function () {
					splash.style.opacity = '0';
					setTimeout(function () {
						if (splash.parentNode) splash.parentNode.removeChild(splash);
					}, 1100);
				}, Math.max(0, MIN_VISIBLE_MS - (Date.now() - shownAt)));
			};
			// Never keep the splash forever, e.g. if the first photo fails to load.
			setTimeout(window.hideSplash, 30000);
		})();
	</script>
	<div style="display: contents">%sveltekit.body%</div>
	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker
					.register('/pwa-service-worker.js')
					.then(() => console.log('PWA service worker registered'))
					.catch(console.error);
			});
		}
	</script>
</body>

</html>
